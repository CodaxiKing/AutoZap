name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PinSave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PinSave-apk
          path: PinSave.apk

      # Publica o APK em Releases para dar para baixar direto pelo celular.
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PinSave.apk \
            --target "$GITHUB_SHA" \
            --title "PinSave (build mais recente)" \
            --notes "Baixe o PinSave.apk abaixo e abra no celular Android para instalar."
